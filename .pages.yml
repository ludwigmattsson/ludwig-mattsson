media:
  - name: images
    label: Images
    input: assets/framerusercontent.com/images
    output: /assets/framerusercontent.com/images
    extensions: [png, jpg, jpeg, gif, webp]
    rename: safe
  - name: files
    label: Files
    input: assets/framerusercontent.com/assets
    output: /assets/framerusercontent.com/assets
    categories: [document, video, audio, compressed, font]

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, featured, date]
      sort: [order, title, date]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9åäöéèü\\-&]+$"
          message: "Use lowercase URL text, numbers, hyphens, and the existing Swedish characters."
      - name: description
        label: Description
        type: string
      - name: seoTitle
        label: Search title
        type: string
        description: Optional title used only for browser tabs, sharing, and search.
      - name: seoDescription
        label: Search description
        type: text
        description: Optional summary used only for search engines and social previews.
      - name: seoKeywords
        label: Search keywords
        type: string
        list: true
        description: Optional hidden search topics such as film direction, design systems, motion graphics.
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: design
              label: Design
            - name: film
              label: Film
            - name: design-film
              label: Design, Film
      - name: date
        label: Date
        type: date
      - name: order
        label: Sort order
        type: number
        required: true
      - name: featured
        label: Show on site
        type: boolean
      - name: cover
        label: Cover image
        type: image
        required: true
        options:
          media: images
      - name: gallery
        label: Wide gallery
        type: image
        options:
          media: images
          multiple: true
      - name: standingGallery
        label: Standing gallery
        type: image
        options:
          media: images
          multiple: true
      - name: squareGallery
        label: Square gallery
        type: image
        options:
          media: images
          multiple: true
      - name: videoEmbeds
        label: Video embeds
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{provider}: {url}"
        fields:
          - name: provider
            label: Provider
            type: select
            options:
              values: [vimeo, youtube]
          - name: url
            label: URL
            type: string
          - name: autoplay
            label: Autoplay
            type: boolean
          - name: loop
            label: Loop
            type: boolean
          - name: muted
            label: Muted
            type: boolean
      - name: externalLinks
        label: External links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            type: string
          - name: url
            type: string
      - name: body
        label: Body
        type: rich-text
        options:
          media: images
          format: markdown

  - name: site
    label: Site settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: title
        type: string
      - name: description
        type: string
      - name: keywords
        label: Search keywords
        type: string
        list: true
      - name: intro
        type: text
      - name: bio
        type: text
      - name: inquiry
        type: text
      - name: phone
        type: string
      - name: email
        type: string
      - name: expertise
        type: string
        list: true
      - name: clients
        type: string
        list: true
      - name: selection
        type: string
        list: true
      - name: featuredIn
        label: Featured in
        type: string
        list: true
      - name: social
        label: Social links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            type: string
          - name: url
            type: string
